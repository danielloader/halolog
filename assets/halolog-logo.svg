<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AD8E2"/>
      <stop offset="1" stop-color="#2A98A2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0C1116"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="url(#ringgrad)" stroke-width="34" filter="url(#glow)"/>
</svg>
