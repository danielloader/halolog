# GoReleaser configuration for halolog (library module).
# @author Admilson B. F. Cossa

version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify
    - go test ./...

builds:
  - skip: true  # Library only, no binaries to build

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: '⚡ Performance'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: '🔧 Maintenance'
      regexp: '^.*?(chore|refactor|style)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other Changes
      order: 999
  filters:
    exclude: ['^test:', '^ci:', '^docs:', Merge pull request, Merge branch]

release:
  github:
    owner: go-gen-ecosystem
    name: halolog
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## HaloLog {{.Tag}}

    Zero-allocation structured logging for Go.

    ```bash
    go get github.com/go-gen-ecosystem/halolog@{{.Tag}}
    ```
  footer: |
    **Full changelog:** https://github.com/go-gen-ecosystem/halolog/compare/{{.PreviousTag}}...{{.Tag}}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"
